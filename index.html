<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Para Alexita 🌻</title>
<meta name="theme-color" content="#14091f" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
<style>
  :root{
    --gold:#ffd23f;
    --gold-soft:#ffe98a;
    --cream:#fff7d6;
    --rose:#f2a0b4;
    --bg-1:#1b0f2e;
    --bg-2:#0a0612;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% 12%, #33204d 0%, rgba(27,15,46,0) 55%),
      radial-gradient(90% 70% at 50% 105%, #3a2410 0%, rgba(10,6,18,0) 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    font-family:'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color:var(--cream);
  }
  body::after{
    content:'';
    position:fixed; inset:0;
    background:radial-gradient(70% 55% at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%);
    pointer-events:none; z-index:2;
  }

  #fx{ position:fixed; inset:0; z-index:3; pointer-events:none; }

  .stage{
    position:fixed; inset:0; z-index:4;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
    gap:1.5vh;
    padding:4vh 0 5vh;
  }

  .glow{
    position:absolute; left:50%; top:58%;
    width:min(120vw,900px); aspect-ratio:1;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,196,50,.30) 0%, rgba(255,196,50,.10) 38%, rgba(255,196,50,0) 68%);
    opacity:0; transition:opacity 1.6s ease .5s;
    pointer-events:none; filter:blur(6px);
  }
  .revealed .glow{ opacity:1; animation:breathe 6s ease-in-out 2s infinite; }

  .bouquet-wrap{
    order:1; position:relative; flex:0 0 auto;
    opacity:0; transform:scale(.94) translateY(10px);
    transition:opacity .6s ease, transform .9s cubic-bezier(.2,1,.3,1);
  }
  .revealed .bouquet-wrap{ opacity:1; transform:scale(1) translateY(0); }

  svg.bouquet{
    display:block;
    height:min(68vh, 112vw);
    width:auto;
    overflow:visible;
    filter:drop-shadow(0 22px 40px rgba(0,0,0,.55)) drop-shadow(0 0 26px rgba(255,196,50,.18));
  }

  #sway{ transform-box:view-box; transform-origin:50% 98%; }
  .revealed #sway{ animation:sway 7s ease-in-out 2.6s infinite; }

  /* ---------- trayectorias y piezas ---------- */
  .stem{
    fill:none; stroke:url(#gStem); stroke-width:5;
    stroke-linecap:round; stroke-dasharray:var(--len); stroke-dashoffset:var(--len);
  }
  .stem.thin{ stroke-width:3; }
  .revealed .stem{ animation:draw .85s cubic-bezier(.3,.8,.4,1) forwards; animation-delay:var(--d,0s); }

  .leaf-grow{ transform-box:fill-box; transform-origin:0% 60%; transform:scale(0); opacity:0; }
  .revealed .leaf-grow{ animation:growLeaf .7s cubic-bezier(.2,1.4,.5,1) forwards; animation-delay:var(--d,0s); }

  .paper{ transform-box:fill-box; transform-origin:50% 100%; transform:scale(.55); opacity:0; }
  .revealed .paper{ animation:paperUp .75s cubic-bezier(.2,1.2,.4,1) forwards; animation-delay:var(--d,0s); }

  .bloom{ transform-box:fill-box; transform-origin:50% 62%; transform:scale(.04); opacity:0; }
  .revealed .bloom{ animation:bloom 1s cubic-bezier(.18,1.45,.5,1) forwards; animation-delay:var(--d,0s); }

  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes growLeaf{ 0%{ transform:scale(0) rotate(-14deg); opacity:0 } 60%{ opacity:1 } 100%{ transform:scale(1) rotate(0deg); opacity:1 } }
  @keyframes paperUp{ to{ transform:scale(1); opacity:1 } }
  @keyframes bloom{
    0%{ transform:scale(.04) rotate(-9deg); opacity:0 }
    55%{ opacity:1 }
    100%{ transform:scale(1) rotate(0deg); opacity:1 }
  }
  @keyframes sway{
    0%,100%{ transform:rotate(-1.3deg) translateY(0) }
    50%{ transform:rotate(1.3deg) translateY(-6px) }
  }
  @keyframes breathe{
    0%,100%{ opacity:.85; transform:translate(-50%,-50%) scale(1) }
    50%{ opacity:1; transform:translate(-50%,-50%) scale(1.06) }
  }

  /* ---------- mensaje ---------- */
  .message{
    order:0; flex:0 1 auto; min-height:0;
    width:100%; max-width:920px;
    padding:0 5vw; margin:0;
    text-align:center; z-index:6;
    opacity:0; transform:translateY(-16px) scale(.96);
  }
  .revealed .message{ animation:msgIn 1.5s cubic-bezier(.2,.9,.3,1) forwards; animation-delay:2.2s; }
  .message .line1{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size:clamp(1.7rem, 6.4vw, 3.6rem);
    line-height:1.15;
    color:#fff8dd;
    text-shadow:0 0 26px rgba(255,205,60,.55), 0 4px 18px rgba(0,0,0,.6);
  }
  .message .line2{
    font-family:'Dancing Script', cursive;
    font-weight:600;
    font-size:clamp(1.45rem, 5.4vw, 2.9rem);
    margin-top:.25em;
    color:var(--gold-soft);
    text-shadow:0 0 18px rgba(255,205,60,.45), 0 3px 14px rgba(0,0,0,.6);
  }
  .message .heart{
    display:inline-block; margin-top:.5em;
    font-size:clamp(1rem,3.2vw,1.5rem); color:#ff8fae;
    text-shadow:0 0 18px rgba(255,143,174,.75);
  }
  .revealed .message .heart{ animation:beat 1.7s ease-in-out 3.6s infinite; }
  @keyframes beat{ 0%,100%{ transform:scale(1) } 18%{ transform:scale(1.28) } 36%{ transform:scale(1) } }
  @keyframes msgIn{ to{ opacity:1; transform:translateY(0) scale(1) } }

  /* ---------- botones ---------- */
  .open-wrap{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; z-index:7; pointer-events:none; }
  .revealed .open-wrap{ animation:wrapOut .5s ease forwards; }
  @keyframes wrapOut{ to{ opacity:0; visibility:hidden } }

  .hint{
    font-weight:300; letter-spacing:.32em; text-transform:uppercase;
    font-size:clamp(.62rem,2.4vw,.8rem);
    color:rgba(255,247,214,.62);
    animation:bob 3s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{ transform:translateY(0); opacity:.6 } 50%{ transform:translateY(-6px); opacity:1 } }

  .open-btn{
    pointer-events:auto; cursor:pointer;
    position:relative;
    border:0; border-radius:999px;
    padding:clamp(15px,2.4vh,20px) clamp(38px,9vw,58px);
    font-family:'Poppins',sans-serif; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase;
    font-size:clamp(.78rem,2.7vw,.95rem);
    color:#3b2405;
    background:linear-gradient(145deg,#fff0a8 0%, #ffd23f 45%, #f0a91b 100%);
    box-shadow:0 10px 34px rgba(255,190,40,.42), 0 2px 0 rgba(255,255,255,.65) inset, 0 -4px 12px rgba(160,100,0,.28) inset;
    transition:transform .25s cubic-bezier(.2,1.4,.5,1), box-shadow .25s ease;
  }
  .open-btn::before{
    content:''; position:absolute; inset:-10px; border-radius:999px;
    border:1px solid rgba(255,210,63,.55);
    animation:pulse 2.4s ease-out infinite;
  }
  .open-btn::after{
    content:''; position:absolute; inset:-22px; border-radius:999px;
    border:1px solid rgba(255,210,63,.25);
    animation:pulse 2.4s ease-out 1.2s infinite;
  }
  .open-btn:hover{ transform:translateY(-3px) scale(1.045); box-shadow:0 16px 44px rgba(255,190,40,.55), 0 2px 0 rgba(255,255,255,.7) inset; }
  .open-btn:active{ transform:translateY(0) scale(.97); }
  @keyframes pulse{ 0%{ transform:scale(.92); opacity:.85 } 100%{ transform:scale(1.35); opacity:0 } }

  .replay-btn{
    position:absolute; bottom:calc(14px + env(safe-area-inset-bottom)); left:50%;
    transform:translateX(-50%);
    z-index:8; opacity:0; pointer-events:none;
    border:1px solid rgba(255,247,214,.28);
    background:rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    color:rgba(255,247,214,.82);
    font-family:'Poppins',sans-serif; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase;
    padding:10px 20px; border-radius:999px; cursor:pointer;
    transition:background .25s, color .25s, transform .25s;
  }
  .replay-btn:hover{ background:rgba(255,210,63,.16); color:#fff8dd; transform:translateX(-50%) translateY(-2px); }
  .revealed .replay-btn{ animation:fadeUp .9s ease forwards; animation-delay:3.2s; pointer-events:auto; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateX(-50%) translateY(10px) } to{ opacity:1; transform:translateX(-50%) translateY(0) } }

  @media (max-width:520px){
    .stage{ padding:3vh 0 4vh; gap:1vh; }
    .message .line1{ font-size:clamp(1.5rem, 7vw, 2.4rem); }
    .message .line2{ font-size:clamp(1.25rem, 6vw, 2rem); }
    svg.bouquet{ height:min(58vh, 118vw); }
  }
  @media (orientation:landscape) and (max-height:560px){
    .stage{ padding:2vh 0 2vh; flex-direction:row; gap:0; justify-content:center; }
    .message{ order:0; max-width:50%; padding-left:4vw; text-align:left; }
    .bouquet-wrap{ order:1; }
    svg.bouquet{ height:min(90vh, 46vw); }
    .message .line1{ font-size:clamp(1.2rem, 3.4vw, 2.2rem); }
    .message .line2{ font-size:clamp(1rem, 2.8vw, 1.8rem); }
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="stage">
  <div class="glow" aria-hidden="true"></div>

  <div class="message" role="status">
    <div class="line1">Aunque sea virtuales pero con cariño,</div>
    <div class="line2">tq Alexita</div>
    <div class="heart">&#10084;</div>
  </div>

  <div class="bouquet-wrap">
    <svg class="bouquet" viewBox="60 70 480 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ramo de flores amarillas">
      <defs>
        <radialGradient id="gPetalY" cx="50%" cy="30%" r="78%">
          <stop offset="0%" stop-color="#fff3b0"/>
          <stop offset="52%" stop-color="#ffd23f"/>
          <stop offset="100%" stop-color="#eda012"/>
        </radialGradient>
        <radialGradient id="gPetalY2" cx="50%" cy="32%" r="80%">
          <stop offset="0%" stop-color="#fffbd6"/>
          <stop offset="68%" stop-color="#ffc61f"/>
          <stop offset="100%" stop-color="#dd8c07"/>
        </radialGradient>
        <radialGradient id="gCenter" cx="40%" cy="34%" r="82%">
          <stop offset="0%" stop-color="#96611f"/>
          <stop offset="60%" stop-color="#6b3f10"/>
          <stop offset="100%" stop-color="#3f2206"/>
        </radialGradient>
        <radialGradient id="gTulLight" cx="45%" cy="24%" r="82%">
          <stop offset="0%" stop-color="#fff6bd"/>
          <stop offset="55%" stop-color="#ffd63f"/>
          <stop offset="100%" stop-color="#eb9c10"/>
        </radialGradient>
        <radialGradient id="gTulDark" cx="45%" cy="26%" r="82%">
          <stop offset="0%" stop-color="#ffd94f"/>
          <stop offset="55%" stop-color="#f2ad15"/>
          <stop offset="100%" stop-color="#c97a06"/>
        </radialGradient>
        <radialGradient id="gDaisyP" cx="50%" cy="20%" r="85%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="70%" stop-color="#fffceb"/>
          <stop offset="100%" stop-color="#f0e0b4"/>
        </radialGradient>
        <radialGradient id="gDaisyC" cx="42%" cy="34%" r="80%">
          <stop offset="0%" stop-color="#ffe873"/>
          <stop offset="60%" stop-color="#ffc61f"/>
          <stop offset="100%" stop-color="#dd8c07"/>
        </radialGradient>
        <linearGradient id="gStem" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#215c2c"/>
          <stop offset="60%" stop-color="#3d9648"/>
          <stop offset="100%" stop-color="#5cba5f"/>
        </linearGradient>
        <linearGradient id="gLeaf" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#2a7a34"/>
          <stop offset="100%" stop-color="#66c163"/>
        </linearGradient>
        <linearGradient id="gPaper" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f3dcb6"/>
          <stop offset="55%" stop-color="#e2c28d"/>
          <stop offset="100%" stop-color="#c69a5e"/>
        </linearGradient>
        <linearGradient id="gPaperFront" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff5e0"/>
          <stop offset="60%" stop-color="#f0d9ae"/>
          <stop offset="100%" stop-color="#dcbc88"/>
        </linearGradient>
        <linearGradient id="gRibbon" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffc2d2"/>
          <stop offset="100%" stop-color="#e07f98"/>
        </linearGradient>
        <linearGradient id="gRibbonDark" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f2a0b4"/>
          <stop offset="100%" stop-color="#c95f7c"/>
        </linearGradient>
      </defs>
      <g id="sway">
        <g id="stems"></g>
        <g id="leaves"></g>
        <g id="flowers"></g>
        <g id="wrap">
          <g class="paper" style="--d:.15s">
            <path d="M190,442 Q300,392 410,442 C412,512 384,568 328,608 Q300,628 272,608 C216,568 188,512 190,442 Z" fill="url(#gPaper)"/>
            <path d="M300,626 C300,626 216,560 204,448" fill="none" stroke="#b98a4e" stroke-opacity=".35" stroke-width="1.6"/>
            <path d="M300,626 C300,626 384,560 396,448" fill="none" stroke="#b98a4e" stroke-opacity=".28" stroke-width="1.4"/>
          </g>
          <g class="paper" style="--d:.35s">
            <path d="M228,450 Q300,490 372,450 C374,510 354,554 314,590 Q300,604 286,590 C246,554 226,510 228,450 Z" fill="url(#gPaperFront)"/>
            <path d="M286,592 C286,592 232,552 228,452" fill="none" stroke="#c69a5e" stroke-opacity=".4" stroke-width="1.3"/>
            <path d="M314,592 C314,592 368,552 372,452" fill="none" stroke="#c69a5e" stroke-opacity=".28" stroke-width="1.1"/>
          </g>
          <g class="paper" style="--d:.6s">
            <path d="M250,518 Q300,498 350,518 L348,540 Q300,520 252,540 Z" fill="url(#gRibbon)"/>
            <path d="M250,518 Q300,498 350,518" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.2"/>
            <path d="M252,540 Q300,520 348,540" fill="none" stroke="#a84a66" stroke-opacity=".35" stroke-width="1"/>
            <g transform="translate(300,528) scale(.86)">
              <path d="M0,-6 C-24,-24 -44,-13 -37,4 C-31,19 -11,13 0,4 Z" fill="url(#gRibbonDark)"/>
              <path d="M0,-6 C24,-24 44,-13 37,4 C31,19 11,13 0,4 Z" fill="url(#gRibbonDark)"/>
              <path d="M-7,10 C-22,20 -26,34 -18,40 C-10,45 -2,30 0,14 Z" fill="url(#gRibbon)"/>
              <path d="M7,10 C22,20 26,34 18,40 C10,45 2,30 0,14 Z" fill="url(#gRibbon)"/>
              <circle r="9" fill="url(#gRibbon)"/>
              <circle r="9" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="1"/>
            </g>
          </g>
        </g>
      </g>
    </svg>
  </div>
</div>

<div class="open-wrap">
  <div class="hint">Tengo algo para ti</div>
  <button class="open-btn" id="openBtn" type="button">Ábreme</button>
</div>

<button class="replay-btn" id="replayBtn" type="button">&#8635; Repetir</button>

<script>
(function(){
  'use strict';

  /* ============================================================
     1. Construcción de las flores (SVG generado)
     ============================================================ */
  function ring(n, dist, rx, ry, fill, off, stroke){
    var s = '';
    for (var i = 0; i < n; i++){
      var a = off + (360 / n) * i;
      s += '<ellipse cx="0" cy="' + (-dist) + '" rx="' + rx + '" ry="' + ry +
           '" fill="' + fill + '" transform="rotate(' + a + ')"' +
           (stroke ? ' stroke="' + stroke + '" stroke-opacity=".33" stroke-width=".9"' : '') + '/>';
    }
    return s;
  }

  function seeds(){
    var s = '';
    for (var i = 0; i < 48; i++){
      var r = Math.sqrt(i / 48) * 12.4;
      var a = i * 2.39996;
      s += '<circle cx="' + (Math.cos(a) * r).toFixed(2) + '" cy="' + (Math.sin(a) * r).toFixed(2) +
           '" r="1.15" fill="#42230a" opacity=".5"/>';
    }
    return s;
  }

  var FLOWER = {
    sunflower: function(s){
      return '<g transform="scale(' + s + ')">' +
        ring(18, 34, 7.2, 19, 'url(#gPetalY)', 0, '#e59a10') +
        ring(11, 21, 6, 12, 'url(#gPetalY2)', 16.4) +
        '<circle r="14" fill="url(#gCenter)"/>' +
        '<circle r="14" fill="none" stroke="#331c05" stroke-opacity=".35" stroke-width="1"/>' +
        seeds() +
        '<circle r="14" fill="none" stroke="#ffd23f" stroke-opacity=".28" stroke-width="1.6"/>' +
      '</g>';
    },
    tulip: function(s){
      return '<g transform="scale(' + s + ')">' +
        '<path d="M0,17 C-12,12 -15,-2 -11,-15 C-8,-21 -1,-16 0,-6 Z" fill="url(#gTulDark)"/>' +
        '<path d="M0,17 C12,12 15,-2 11,-15 C8,-21 1,-16 0,-6 Z" fill="url(#gTulDark)"/>' +
        '<path d="M0,17 C-7,12 -9,-3 -5,-16 C-3,-21 3,-21 5,-16 C9,-3 7,12 0,17 Z" fill="url(#gTulLight)"/>' +
        '<path d="M0,16 C-4,10 -4,-3 0,-13 C4,-3 4,10 0,16 Z" fill="#fffbd6" opacity=".35"/>' +
        '<path d="M-3.5,17 C-4,6 -4,-4 -2,-11" fill="none" stroke="#c97a06" stroke-opacity=".22" stroke-width="1"/>' +
        '<path d="M3.5,17 C4,6 4,-4 2,-11" fill="none" stroke="#c97a06" stroke-opacity=".22" stroke-width="1"/>' +
      '</g>';
    },
    daisy: function(s){
      var petals = '';
      for (var i = 0; i < 9; i++){
        var a = (360 / 9) * i + 12;
        petals += '<ellipse cx="0" cy="-15" rx="4.4" ry="11" fill="url(#gDaisyP)" transform="rotate(' + a + ')" stroke="#e8d6a6" stroke-opacity=".5" stroke-width=".8"/>';
      }
      return '<g transform="scale(' + s + ')">' + petals +
        '<circle r="6.6" fill="url(#gDaisyC)"/>' +
        '<circle r="6.6" fill="none" stroke="#c98a06" stroke-opacity=".4" stroke-width=".9"/>' +
        '<circle r="2.4" fill="#e8a90e" opacity=".55"/>' +
      '</g>';
    },
    bud: function(s){
      return '<g transform="scale(' + s + ')">' +
        '<path d="M0,11 C-8,7 -9,-7 -4,-14 C-2,-17 2,-17 4,-14 C9,-7 8,7 0,11 Z" fill="url(#gTulLight)"/>' +
        '<path d="M0,-15 C-6,-9 -6,2 0,9 C6,2 6,-9 0,-15 Z" fill="#fff4b0" opacity=".55"/>' +
        '<path d="M-1,-14 C-9,-8 -9,4 -1,10" fill="none" stroke="#2f7d38" stroke-opacity=".5" stroke-width="1.4"/>' +
      '</g>';
    },
    leaf: function(s){
      return '<g class="leaf-grow" style="--d:var(--leafd,.9s)" transform="scale(' + s + ')">' +
        '<path d="M0,0 C11,-17 30,-23 43,-15 C27,3 11,7 0,0 Z" fill="url(#gLeaf)"/>' +
        '<path d="M2,-1 C14,-8 29,-13 40,-14" fill="none" stroke="#2a7a34" stroke-opacity=".55" stroke-width="1.1"/>' +
        '<path d="M14,-6 C16,-12 18,-16 20,-19 M24,-9 C26,-14 28,-17 30,-19" fill="none" stroke="#2a7a34" stroke-opacity=".35" stroke-width=".9"/>' +
      '</g>';
    }
  };

  /* Posiciones: base del ramo = (300, 600) */
  var BASE = { x: 300, y: 556 };

  /* Se dibujan en orden: fondo -> frente */
  var FLOWERS = [
    { t: 'sunflower', x: 300, y: 196, s: 1.22, d: 1.05 },
    { t: 'sunflower', x: 152, y: 292, s: 1.00, d: 1.20 },
    { t: 'sunflower', x: 450, y: 278, s: 1.04, d: 1.30 },

    { t: 'daisy', x: 104, y: 300, s: 1.10, d: 1.62 },
    { t: 'daisy', x: 498, y: 302, s: 1.05, d: 1.66 },
    { t: 'daisy', x: 158, y: 206, s: 0.95, d: 1.72 },
    { t: 'daisy', x: 444, y: 196, s: 0.95, d: 1.76 },
    { t: 'daisy', x: 234, y: 124, s: 0.90, d: 1.82 },
    { t: 'daisy', x: 372, y: 120, s: 0.88, d: 1.86 },
    { t: 'daisy', x: 214, y: 336, s: 0.82, d: 1.90 },

    { t: 'bud', x: 88, y: 384, s: 1.05, d: 1.80 },
    { t: 'bud', x: 516, y: 364, s: 1.00, d: 1.84 },

    { t: 'tulip', x: 128, y: 396, s: 1.08, d: 1.42 },
    { t: 'tulip', x: 476, y: 388, s: 1.02, d: 1.46 },
    { t: 'tulip', x: 232, y: 372, s: 1.18, d: 1.36 },
    { t: 'tulip', x: 368, y: 366, s: 1.15, d: 1.40 },
    { t: 'tulip', x: 300, y: 402, s: 1.32, d: 1.30 }
  ];

  var LEAVES = [
    { x: 238, y: 428, s: 0.78, rot: -30 },
    { x: 362, y: 422, s: 0.80, rot: 202 },
    { x: 176, y: 402, s: 0.70, rot: -50 },
    { x: 426, y: 396, s: 0.72, rot: 216 },
    { x: 300, y: 416, s: 0.64, rot: -6 },
    { x: 132, y: 340, s: 0.60, rot: -62 },
    { x: 470, y: 332, s: 0.62, rot: 226 },
    { x: 206, y: 292, s: 0.56, rot: -40 },
    { x: 396, y: 286, s: 0.58, rot: 220 },
    { x: 262, y: 398, s: 0.60, rot: -18 },
    { x: 338, y: 394, s: 0.60, rot: 198 },
    { x: 300, y: 350, s: 0.54, rot: 18 }
  ];

  function stemPath(cx, cy){
    var midY = (BASE.y + cy) / 2 + 18;
    var ctrlX = cx + (BASE.x - cx) * 0.42;
    return 'M' + BASE.x + ',' + BASE.y + ' Q' + ctrlX.toFixed(1) + ',' + midY.toFixed(1) + ' ' + cx + ',' + (cy + 6);
  }

  var stemsEl = document.getElementById('stems');
  var leavesEl = document.getElementById('leaves');
  var flowersEl = document.getElementById('flowers');

  var i, f, l;

  for (i = 0; i < FLOWERS.length; i++){
    f = FLOWERS[i];
    var thin = (f.t === 'daisy' || f.t === 'bud') ? ' thin' : '';
    stemsEl.insertAdjacentHTML('beforeend',
      '<path class="stem' + thin + '" d="' + stemPath(f.x, f.y) + '" style="--d:' + (0.45 + i * 0.03).toFixed(2) + 's"/>');
  }

  for (i = 0; i < LEAVES.length; i++){
    l = LEAVES[i];
    leavesEl.insertAdjacentHTML('beforeend',
      '<g transform="translate(' + l.x + ',' + l.y + ') rotate(' + l.rot + ')">' +
        FLOWER.leaf(l.s).replace('var(--leafd,.9s)', (1.15 + i * 0.06).toFixed(2) + 's') +
      '</g>');
  }

  for (i = 0; i < FLOWERS.length; i++){
    f = FLOWERS[i];
    flowersEl.insertAdjacentHTML('beforeend',
      '<g transform="translate(' + f.x + ',' + f.y + ')">' +
        '<g class="bloom" style="--d:' + f.d.toFixed(2) + 's">' + FLOWER[f.t](f.s) + '</g>' +
      '</g>');
  }

  /* Longitudes reales de los tallos para animar el trazo */
  window.requestAnimationFrame(function(){
    var stems = document.querySelectorAll('.stem');
    for (var k = 0; k < stems.length; k++){
      try {
        var len = stems[k].getTotalLength();
        stems[k].style.setProperty('--len', len.toFixed(1));
      } catch (e) {
        stems[k].style.setProperty('--len', 600);
      }
    }
  });

  /* ============================================================
     2. Partículas (pétalos y destellos) en canvas
     ============================================================ */
  var cvs = document.getElementById('fx');
  var ctx = cvs.getContext('2d');
  var DPR = 1, W = 0, H = 0;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.floor(window.innerWidth * DPR);
    H = Math.floor(window.innerHeight * DPR);
    cvs.width = W; cvs.height = H;
    cvs.style.width = window.innerWidth + 'px';
    cvs.style.height = window.innerHeight + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  var petals = [];
  var sparks = [];
  var COLORS = ['#ffd23f', '#ffe98a', '#fff3b0', '#ffc61f', '#f7b733'];

  function pick(a){ return a[(Math.random() * a.length) | 0]; }

  function addPetal(o){
    petals.push({
      x: o.x, y: o.y,
      vx: o.vx, vy: o.vy,
      size: (4.5 + Math.random() * 6.5) * DPR * (o.scale || 1),
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.05,
      ph: Math.random() * Math.PI * 2,
      amp: (0.35 + Math.random() * 0.9) * DPR,
      color: pick(COLORS),
      alpha: o.alpha || 0.9,
      fade: o.fade || 0.0016
    });
  }

  function addSpark(o){
    sparks.push({
      x: o.x, y: o.y,
      vx: o.vx, vy: o.vy,
      size: (1.4 + Math.random() * 2.8) * DPR,
      life: 1,
      decay: 0.008 + Math.random() * 0.018,
      color: Math.random() < 0.25 ? '#fff6c9' : pick(COLORS)
    });
  }

  function rainPetal(){
    if (petals.length > 34) return;
    addPetal({
      x: Math.random() * W,
      y: -30 * DPR,
      vx: (Math.random() - 0.5) * 0.3 * DPR,
      vy: (0.35 + Math.random() * 0.8) * DPR,
      alpha: 0.55 + Math.random() * 0.3,
      fade: 0
    });
  }

  function burst(cx, cy){
    var n = window.innerWidth < 700 ? 70 : 110;
    for (var k = 0; k < n; k++){
      var ang = Math.random() * Math.PI * 2;
      var spd = (2 + Math.random() * 10) * DPR;
      var item = {
        x: cx, y: cy,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 2.4 * DPR,
        scale: 0.5 + Math.random() * 0.7,
        fade: 0.004 + Math.random() * 0.004
      };
      if (Math.random() < 0.32) addPetal(item);
      else addSpark(item);
    }
  }

  function drawPetal(p){
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size * 0.55, p.size, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = Math.max(0, p.alpha) * 0.35;
    ctx.strokeStyle = '#c98a06';
    ctx.lineWidth = 0.8 * DPR;
    ctx.stroke();
    ctx.restore();
  }

  function drawSpark(s){
    ctx.save();
    ctx.globalAlpha = Math.max(0, s.life * 0.9);
    var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 4);
    g.addColorStop(0, s.color);
    g.addColorStop(1, 'rgba(255,210,63,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  var t = 0;
  function loop(){
    t += 0.016;
    ctx.clearRect(0, 0, W, H);

    for (var i = petals.length - 1; i >= 0; i--){
      var p = petals[i];
      p.ph += 0.035;
      p.x += p.vx + Math.sin(p.ph) * p.amp * 0.35;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.fade) p.alpha -= p.fade;
      if (p.y > H + 60 * DPR || p.x < -80 * DPR || p.x > W + 80 * DPR || p.alpha <= 0){
        petals.splice(i, 1);
        continue;
      }
      drawPetal(p);
    }

    for (var j = sparks.length - 1; j >= 0; j--){
      var s = sparks[j];
      s.x += s.vx; s.y += s.vy;
      s.vx *= 0.965; s.vy = s.vy * 0.965 + 0.06 * DPR;
      s.life -= s.decay;
      if (s.life <= 0){ sparks.splice(j, 1); continue; }
      drawSpark(s);
    }

    requestAnimationFrame(loop);
  }
  loop();

  /* lluvia suave de fondo, incluso antes de abrir */
  var rainRate = 0;
  setInterval(function(){
    if (document.body.classList.contains('revealed')){
      if (rainRate < 1){ rainPetal(); rainRate++; }
    } else if (Math.random() < 0.3){
      rainPetal();
    }
  }, 340);

  /* ============================================================
     3. Interacción
     ============================================================ */
  var revealed = false;

  function reveal(){
    if (revealed) return;
    revealed = true;
    document.body.classList.add('revealed');

    var cx = W / 2;
    var cy = H * 0.55;
    burst(cx, cy);

    setTimeout(function(){ burst(W * 0.22, H * 0.42); }, 260);
    setTimeout(function(){ burst(W * 0.78, H * 0.42); }, 480);
    setTimeout(function(){ burst(W * 0.5, H * 0.78); }, 900);

    setTimeout(function(){
      for (var k = 0; k < 45; k++){
        addSpark({ x: W / 2, y: H * 0.5, vx: (Math.random() - 0.5) * 5 * DPR, vy: (Math.random() - 0.5) * 5 * DPR });
      }
    }, 1500);
  }

  document.getElementById('openBtn').addEventListener('click', reveal);
  document.getElementById('replayBtn').addEventListener('click', function(){
    petals.length = 0; sparks.length = 0;
    rainRate = 0;
    document.body.classList.remove('revealed');
    revealed = false;
    void document.body.offsetWidth;
    setTimeout(reveal, 420);
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (!revealed) reveal();
    }
  });
})();
</script>
</body>
</html>
